<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ダッシュボード - 佳久創さんトークショー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* パスワード入力モーダル／オーバーレイ */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(244, 246, 248, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background-color: #ffffff;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .auth-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.25rem;
            color: #d35400;
        }

        .auth-card p {
            margin: 0 0 20px 0;
            font-size: 0.85rem;
            color: #666;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }

        .auth-input:focus {
            border-color: #e67e22;
        }

        .auth-btn {
            width: 100%;
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background-color: #d35400;
        }

        .auth-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* メインダッシュボードコンテンツ（初期状態は非表示） */
        #admin-content {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #333;
        }

        .btn-logout {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- パスワード認証画面 -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>スタッフ認証</h2>
            <p>管理ダッシュボードを開くにはパスワードを入力してください。</p>
            <form onsubmit="checkPassword(event)">
                <input type="password" id="pass-input" class="auth-input" placeholder="パスワード" maxlength="10" autocomplete="off" autofocus>
                <button type="submit" class="auth-btn">ログイン</button>
            </form>
            <div id="auth-error" class="auth-error">パスワードが違います。</div>
        </div>
    </div>

    <!-- 管理画面メインエリア -->
    <div id="admin-content">
        <div class="header">
            <h1>スタッフ用管理ダッシュボード</h1>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>

        <!-- ここに既存の管理ダッシュボードUI（当選者一覧、状況確認、抽選開始・リセットボタン等）を配置します -->
        <div class="card" style="background: white; padding: 20px; border-radius: 8px;">
            <p>ここに管理メニュー・当選一覧などを表示します。</p>
        </div>
    </div>

    <script>
        // 設定用パスワード
        const ADMIN_PASSWORD = "0213";
        const AUTH_STORAGE_KEY = "admin_authenticated";

        // ページ読み込み時の自動判定
        window.onload = function() {
            if (sessionStorage.getItem(AUTH_STORAGE_KEY) === "true") {
                showDashboard();
            }
        };

        // パスワード確認処理
        function checkPassword(event) {
            event.preventDefault();
            const inputVal = document.getElementById('pass-input').value;
            const errorElement = document.getElementById('auth-error');

            if (inputVal === ADMIN_PASSWORD) {
                sessionStorage.setItem(AUTH_STORAGE_KEY, "true");
                errorElement.style.display = 'none';
                showDashboard();
            } else {
                errorElement.style.display = 'block';
                document.getElementById('pass-input').value = '';
                document.getElementById('pass-input').focus();
            }
        }

        // ダッシュボード画面表示
        function showDashboard() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            
            // ★ダッシュボードデータ読み込み関数などがあればここで実行
            // initDashboardData();
        }

        // ログアウト処理
        function logout() {
            sessionStorage.removeItem(AUTH_STORAGE_KEY);
            location.reload();
        }
    </script>
</body>
</html>
