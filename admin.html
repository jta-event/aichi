<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフ用 リアルタイム管理画面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c3e50;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.1rem;
            margin: 0;
        }
        .refresh-status {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .progress-card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .progress-bar-container {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            background-color: #3498db;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-top: 4px solid #e67e22;
        }
        .card.standing {
            border-top-color: #2980b9;
        }
        .card h2 {
            font-size: 1rem;
            margin: 0 0 12px 0;
            color: #2c3e50;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stat-value {
            font-weight: bold;
        }
        .highlight {
            color: #d35400;
            font-size: 1.2rem;
        }
        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 整理券 運用管理モニタ</h1>
        <div class="refresh-status" id="last-update">更新中...</div>
    </div>

    <!-- 進捗率 -->
    <div class="progress-card">
        <div style="display:flex; justify-content:space-between; font-size:0.9rem; font-weight:bold;">
            <span>時間経過進捗率（10:45〜13:20）</span>
            <span id="progress-text">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- 座席状況 -->
    <div class="grid">
        <!-- 座り見 -->
        <div class="card">
            <h2>🪑 座り見（全36席）</h2>
            <div class="stat-row">
                <span>現時点の解放枠数:</span>
                <span class="stat-value" id="sit-allowed">-</span>
            </div>
            <div class="stat-row">
                <span>当選確定人数:</span>
                <span class="stat-value" id="sit-used">-</span>
            </div>
            <hr style="border:none; border-top:1px dashed #ccc; margin:8px 0;">
            <div class="stat-row">
                <span>現在即時枠の空き:</span>
                <span class="stat-value highlight" id="sit-rem-allowed">-</span>
            </div>
            <div class="stat-row">
                <span>最終残り総席数:</span>
                <span class="stat-value" id="sit-rem-total">-</span>
            </div>
        </div>

        <!-- 立ち見 -->
        <div class="card standing">
            <h2>🚶 立ち見（全16枠）</h2>
            <div class="stat-row">
                <span>現時点の解放枠数:</span>
                <span class="stat-value" id="stand-allowed">-</span>
            </div>
            <div class="stat-row">
                <span>当選確定人数:</span>
                <span class="stat-value" id="stand-used">-</span>
            </div>
            <hr style="border:none; border-top:1px dashed #ccc; margin:8px 0;">
            <div class="stat-row">
                <span>現在即時枠の空き:</span>
                <span class="stat-value highlight" id="stand-rem-allowed">-</span>
            </div>
            <div class="stat-row">
                <span>最終残り総席数:</span>
                <span class="stat-value" id="stand-rem-total">-</span>
            </div>
        </div>
    </div>

    <button class="btn-refresh" onclick="fetchAdminData()">手動で今すぐ更新</button>

    <script>
        // ★ご自身のGAS WebアプリURLを設定
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby_EN0vo4QuzDeJBv9rSfnvuzI1rZ1aHlLihQ3Pt3ziDcKC14Nyr98pJjqfjeX3hP_NqA/exec";

        function fetchAdminData() {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getAdminStatus" })
            })
            .then(res => res.json())
            .then(res => {
                if (!res.success) return;
                const d = res.data;

                // 時刻＆進捗
                document.getElementById('last-update').textContent = `更新: ${d.currentTime}`;
                document.getElementById('progress-text').textContent = `${d.progressPercent}%`;
                document.getElementById('progress-bar').style.width = `${d.progressPercent}%`;

                // 座り見
                document.getElementById('sit-allowed').textContent = `${d.sitting.allowed} 席`;
                document.getElementById('sit-used').textContent = `${d.sitting.used} 名`;
                document.getElementById('sit-rem-allowed').textContent = `${d.sitting.remainingAllowed} 席`;
                document.getElementById('sit-rem-total').textContent = `${d.sitting.remainingTotal} 席`;

                // 立ち見
                document.getElementById('stand-allowed').textContent = `${d.standing.allowed} 枠`;
                document.getElementById('stand-used').textContent = `${d.standing.used} 名`;
                document.getElementById('stand-rem-allowed').textContent = `${d.standing.remainingAllowed} 枠`;
                document.getElementById('stand-rem-total').textContent = `${d.standing.remainingTotal} 枠`;
            })
            .catch(err => console.error("データ取得失敗:", err));
        }

        // 初回実行 & 5秒ごとの自動更新
        fetchAdminData();
        setInterval(fetchAdminData, 5000);
    </script>
</body>
</html>
