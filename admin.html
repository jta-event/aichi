<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフ用 リアルタイム管理画面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 16px;
        }

        /* 認証モーダル画面 */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .auth-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: #2c3e50;
        }
        .auth-card p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 16px;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 0.3em;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .auth-input:focus {
            border-color: #3498db;
        }
        .auth-btn {
            width: 100%;
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .auth-btn:active {
            background: #219653;
        }
        .auth-error {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
        }

        /* ダッシュボード本体 */
        #admin-content {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c3e50;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.1rem;
            margin: 0;
        }
        .refresh-status {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .progress-card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .progress-bar-container {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            background-color: #3498db;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-top: 4px solid #e67e22;
        }
        .card.standing {
            border-top-color: #2980b9;
        }
        .card h2 {
            font-size: 1rem;
            margin: 0 0 12px 0;
            color: #2c3e50;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stat-value {
            font-weight: bold;
        }
        .highlight {
            color: #d35400;
            font-size: 1.2rem;
        }
        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- パスワード認証用モーダル -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>🔒 スタッフ認証</h2>
            <p>管理者パスワードを入力してください</p>
            <input type="password" id="input-pass" class="auth-input" maxlength="4" placeholder="••••" pattern="\d*" inputmode="numeric">
            <button class="auth-btn" onclick="checkPassword()">ログイン</button>
            <div class="auth-error" id="auth-error">パスワードが違います</div>
        </div>
    </div>

    <!-- ダッシュボード本体 -->
    <div id="admin-content">
        <div class="header">
            <h1>📊 整理券 運用管理モニタ</h1>
            <div class="refresh-status" id="last-update">更新中...</div>
        </div>

        <!-- 進捗率 -->
        <div class="progress-card">
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; font-weight:bold;">
                <span>座席解放率（10:45〜13:10で全枠完了）</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- 座席状況 -->
        <div class="grid">
            <!-- 座り見 -->
            <div class="card">
                <h2>🪑 座り見（全36席）</h2>
                <div class="stat-row">
                    <span>現時点の解放枠数:</span>
                    <span class="stat-value" id="sit-allowed">-</span>
                </div>
                <div class="stat-row">
                    <span>当選確定人数:</span>
                    <span class="stat-value" id="sit-used">-</span>
                </div>
                <hr style="border:none; border-top:1px dashed #ccc; margin:8px 0;">
                <div class="stat-row">
                    <span>現在即時枠の空き:</span>
                    <span class="stat-value highlight" id="sit-rem-allowed">-</span>
                </div>
                <div class="stat-row">
                    <span>最終残り総席数:</span>
                    <span class="stat-value" id="sit-rem-total">-</span>
                </div>
            </div>

            <!-- 立ち見 -->
            <div class="card standing">
                <h2>🚶 立ち見（全16枠）</h2>
                <div class="stat-row">
                    <span>現時点の解放枠数:</span>
                    <span class="stat-value" id="stand-allowed">-</span>
                </div>
                <div class="stat-row">
                    <span>当選確定人数:</span>
                    <span class="stat-value" id="stand-used">-</span>
                </div>
                <hr style="border:none; border-top:1px dashed #ccc; margin:8px 0;">
                <div class="stat-row">
                    <span>現在即時枠の空き:</span>
                    <span class="stat-value highlight" id="stand-rem-allowed">-</span>
                </div>
                <div class="stat-row">
                    <span>最終残り総席数:</span>
                    <span class="stat-value" id="stand-rem-total">-</span>
                </div>
            </div>
        </div>

        <button class="btn-refresh" onclick="fetchAdminData()">手動で今すぐ更新</button>
    </div>

    <script>
        const CORRECT_PASS = "0213";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby_EN0vo4QuzDeJBv9rSfnvuzI1rZ1aHlLihQ3Pt3ziDcKC14Nyr98pJjqfjeX3hP_NqA/exec";

        let autoRefreshTimer = null;

        window.onload = function() {
            if (sessionStorage.getItem("admin_authenticated") === "true") {
                unlockDashboard();
            } else {
                document.getElementById("input-pass").addEventListener("keypress", function(e) {
                    if (e.key === "Enter") {
                        checkPassword();
                    }
                });
            }
        };

        function checkPassword() {
            const inputVal = document.getElementById("input-pass").value;
            const errorEl = document.getElementById("auth-error");

            if (inputVal === CORRECT_PASS) {
                sessionStorage.setItem("admin_authenticated", "true");
                unlockDashboard();
            } else {
                errorEl.style.display = "block";
                document.getElementById("input-pass").value = "";
                document.getElementById("input-pass").focus();
            }
        }

        function unlockDashboard() {
            document.getElementById("auth-overlay").style.display = "none";
            document.getElementById("admin-content").style.display = "block";

            fetchAdminData();
            if (!autoRefreshTimer) {
                autoRefreshTimer = setInterval(fetchAdminData, 5000);
            }
        }

        function fetchAdminData() {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getAdminStatus" })
            })
            .then(res => res.json())
            .then(res => {
                if (!res.success) return;
                const d = res.data;

                document.getElementById('last-update').textContent = `更新: ${d.currentTime}`;
                document.getElementById('progress-text').textContent = `${d.progressPercent}%`;
                document.getElementById('progress-bar').style.width = `${d.progressPercent}%`;

                document.getElementById('sit-allowed').textContent = `${d.sitting.allowed} 席`;
                document.getElementById('sit-used').textContent = `${d.sitting.used} 名`;
                document.getElementById('sit-rem-allowed').textContent = `${d.sitting.remainingAllowed} 席`;
                document.getElementById('sit-rem-total').textContent = `${d.sitting.remainingTotal} 席`;

                document.getElementById('stand-allowed').textContent = `${d.standing.allowed} 枠`;
                document.getElementById('stand-used').textContent = `${d.standing.used} 名`;
                document.getElementById('stand-rem-allowed').textContent = `${d.standing.remainingAllowed} 枠`;
                document.getElementById('stand-rem-total').textContent = `${d.standing.remainingTotal} 枠`;
            })
            .catch(err => console.error("データ取得失敗:", err));
        }
    </script>
</body>
</html>
